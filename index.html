<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantio São Simão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f6f1;--sf:#ffffff;--fg:#1d231b;--mu:#5c6656;--ln:#dce1d5;--ln2:#c4cbbb;
  --ac:#3b6a26;--ac-bg:#e5efdb;--ok:#2d6a37;--ok-bg:#e1f0e3;--in:#2f5d8c;--in-bg:#e2ecf7;--wa:#8a5a0b;--wa-bg:#fbeed6;--er:#a3302a;--er-bg:#fbe5e3;
  --f:"Archivo",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:8px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln2);background:var(--sf);border-radius:var(--r);padding:7px 12px}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
button.dg{color:var(--er)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{border:1px solid var(--ln2);border-radius:var(--r);padding:7px 9px;background:var(--sf);width:100%;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mu)}
label.f>*{color:var(--fg);font-size:15px}
header.top{background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
.topin{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.brand small{font-weight:400;color:var(--mu);font-size:13px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 11px;border-radius:6px;color:var(--mu)}
nav.tabs button.on{background:var(--ac-bg);color:var(--ac);font-weight:500}
.sync{margin-left:auto;font-size:12px;color:var(--mu);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--wa)}
.dot.on{background:var(--ok)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:18px}
h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h3{font-size:16px;font-weight:600;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mu{color:var(--mu)}.sm-t{font-size:13px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mu)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:8px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.gh td{background:var(--bg);font-weight:600;font-size:13px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--bg);color:var(--mu)}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-in{background:var(--in-bg);color:var(--in)}.p-wa{background:var(--wa-bg);color:var(--wa)}.p-er{background:var(--er-bg);color:var(--er)}.p-ac{background:var(--ac-bg);color:var(--ac)}
.mono{font-family:var(--mono);font-size:13px}
.empty{padding:22px;text-align:center;color:var(--mu)}
.warn{background:var(--wa-bg);color:var(--wa);border-radius:var(--r);padding:8px 11px;font-size:14px}
.err{color:var(--er);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);cursor:pointer}
.chk input{width:auto}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
table.grade{border-collapse:separate;border-spacing:4px;font-size:13px;min-width:640px}
table.grade th{text-align:center;padding:4px;border:0;vertical-align:bottom}
table.grade th.eh{cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg);font-weight:600;min-width:96px}
table.grade th.eh:hover{color:var(--ac)}
table.grade th.eh span{display:block;font-weight:400;font-size:11px;color:var(--mu);line-height:1.3;margin-top:2px;white-space:normal}
table.grade th:first-child{text-align:left}
td.gt{border:0;white-space:nowrap;padding:6px 4px}
td.gc{text-align:center;border:0;border-radius:6px;padding:8px 4px;white-space:nowrap;cursor:pointer}
td.gc:hover{outline:2px solid var(--ac)}
td.ge{background:none}td.ge:hover{background:var(--ac-bg)}
.g-ok{background:var(--ok-bg);color:var(--ok)}.g-in{background:var(--in-bg);color:var(--in)}.g-wa{background:var(--wa-bg);color:var(--wa)}.g-er{background:var(--er-bg);color:var(--er)}.g-pl{background:var(--sf);border:1px solid var(--ln2)!important}.g-sd{background:none;border:1px dashed var(--ln2)!important;color:var(--mu)}
.rc .pr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--ln)}
.rc .pr:last-child{border-bottom:0}
.chipb{font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid transparent}
/* modal */
#mb{position:fixed;inset:0;background:rgba(20,24,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
#mb[hidden]{display:none}
.md{background:var(--sf);border-radius:12px;width:min(760px,100%);padding:18px;display:grid;gap:14px}
.md.wide{width:min(1000px,100%)}
.mdh{display:flex;align-items:center;gap:10px}
.mdh h3{flex:1}
/* cola */
.cola{background:#fff;color:#1d231b;border:1px solid var(--ln);border-radius:10px;padding:16px;display:grid;gap:12px}
.cola .ch{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #1d231b;padding-bottom:8px}
.cola .ch b{font-size:19px;font-weight:600;display:block}
.cola .ch small{color:#5c6656;font-size:12px}
.cola .cb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
.cola .tbx{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
.cola .tb{border:1px solid #c4cbbb;border-radius:6px;padding:6px 9px;font-size:13px}
.cola .tb b{display:block;font-size:15px}
.cola .reg{background:#e2ecf7;color:#2f5d8c;border-radius:6px;padding:6px 9px;font-size:13px}
.cola table{font-size:13px}
.cola td,.cola th{padding:5px 6px;border-color:#dce1d5;color:#1d231b}
.cola .bb{display:flex;gap:8px;align-items:flex-start;border:1px solid #c4cbbb;border-radius:6px;padding:7px 9px;font-size:13px}
.cola .bb.pa{border-color:#d9a54a;background:#fdf6e8}
.cola .bb.done{background:#e1f0e3;border-color:#7fb48a}
.cola .bx{width:16px;height:16px;border:1.5px solid #5c6656;border-radius:3px;flex:none;margin-top:1px}
.cola .ff{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:12px;color:#5c6656}
.cola .ff div{border-bottom:1px solid #8a9182;padding-bottom:16px}
.cola .pm{font-size:12px;color:#8a5a0b;display:block}
.map{width:100%;height:auto;display:block;border:1px solid #dce1d5;border-radius:6px;background:#fff}
@media (max-width:640px){.cola .cb{grid-template-columns:1fr}.cola .ff{grid-template-columns:1fr 1fr}}
/* login */
.gate{max-width:360px;margin:12vh auto;display:grid;gap:12px;text-align:center}
.gate input{text-align:center;font-size:22px;letter-spacing:.3em}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #print, #print *{visibility:visible}
  #print{position:absolute;left:0;top:0;width:100%}
  #print .cola{border:0;padding:0}
  .noprint{display:none!important}
}
</style>

<script>

function bombas(tl,cap,vazao){const hpb=cap/vazao,out=[];let cur=null;for(const t of tl){let rest=t.ha;while(rest>1e-6){if(!cur){cur={seg:[],ha:0};out.push(cur)}const take=Math.min(rest,hpb-cur.ha);cur.seg.push({n:t.n,ha:take});cur.ha+=take;rest-=take;if(cur.ha>=hpb-1e-6)cur=null}}return {hpb,list:out}}
function carencia(a){const cult=(stal(a.talhao).cultura||'').toLowerCase();let mx=0;(a.prods||[]).forEach(p=>{const pr=prods()[p.p];if(!pr)return;const c=cult==='milho'?pr.carM:pr.carS;if(c>mx)mx=c});return mx}

/* ============ mapa ============ */
const PRJ=(()=>{const c=Math.cos(-22.2*Math.PI/180);let xs=[],ys=[];Object.values(GEO.t).flat().forEach(pl=>pl.forEach(([x,y])=>{xs.push(x*c);ys.push(-y)}));const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),pad=(mxx-mnx)*.015,W=1000,sc=W/(mxx-mnx+2*pad),H=Math.round((mxy-mny+2*pad)*sc);return {W,H,p:([x,y])=>[((x*c-mnx+pad)*sc).toFixed(0),((-y-mny+pad)*sc).toFixed(0)]}})();
const pts=pl=>pl.map(p=>PRJ.p(p).join(',')).join(' ');
function cen(pl){let A=0,cx=0,cy=0;const q=pl.map(p=>PRJ.p(p).map(Number));for(let i=0;i<q.length;i++){const[x1,y1]=q[i],[x2,y2]=q[(i+1)%q.length],k=x1*y2-x2*y1;A+=k;cx+=(x1+x2)*k;cy+=(y1+y2)*k}return [cx/(3*A),cy/(3*A)]}
function mapa(hl,cor){hl=new Set((hl||[]).map(String));cor=cor||{};let s='<svg class="map" viewBox="0 0 '+PRJ.W+' '+PRJ.H+'" role="img" aria-label="Mapa dos talhões">';
s+='<g fill="none" stroke="#639922" stroke-width="2" stroke-dasharray="6 6" opacity=".5">'+GEO.app.map(p=>'<polygon points="'+pts(p)+'"/>').join('')+'</g>';

s+='<g fill="#f1efe8" stroke="#888780" stroke-width="2" opacity=".7">'+GEO.sede.map(p=>'<polygon points="'+pts(p)+'"/>').join('')+'</g>';
let lab='';
Object.entries(GEO.t).forEach(([n,pls])=>{const on=hl.has(n),c=cor[n];pls.forEach(pl=>{s+='<polygon points="'+pts(pl)+'" fill="'+(on?'#c9e3ad':c||'#ffffff')+'" stroke="'+(on?'#2d6a37':'#5c6656')+'" stroke-width="'+(on?8:3)+'" stroke-linejoin="round"/>'});
 const big=pls.reduce((a,b)=>b.length>a.length?b:a);const [x,y]=cen(big);lab+='<text x="'+x.toFixed(0)+'" y="'+(y+(on?22:16)).toFixed(0)+'" font-size="'+(on?64:46)+'" font-weight="'+(on?600:400)+'" text-anchor="middle" fill="'+(on?'#2d6a37':'#5c6656')+'" font-family="Archivo,sans-serif">'+n+'</text>'});
s+=lab+'<text x="960" y="60" font-size="44" text-anchor="middle" fill="#5c6656">N</text><path d="M960,140 L960,84" stroke="#5c6656" stroke-width="5"/><path d="M948,98 L960,76 L972,98 Z" fill="#5c6656"/></svg>';return s}

function renderSetup(m){
  const empty=!D().produtos;
  m.innerHTML='<div class="gate card"><h2>Primeiro acesso</h2><p class="mu sm-t" style="margin:0">Crie o PIN de administrador. Ele dá acesso a todas as telas; os operadores terão PINs próprios.</p><input id="p1" inputmode="numeric" maxlength="8" placeholder="PIN" type="password"><input id="p2" inputmode="numeric" maxlength="8" placeholder="Repita o PIN" type="password"><label class="chk" style="justify-content:center"><input type="checkbox" id="sd" '+(empty?'checked':'')+'> Importar talhões, produtos e Safra 2026</label><div class="err" id="e"></div><button class="pri" onclick="doSetup()">Começar</button></div>';
}
async function doSetup(){const a=p1.value.trim(),b=p2.value.trim();if(a.length<4){e.textContent='Use pelo menos 4 dígitos.';return}if(a!==b){e.textContent='Os PINs não conferem.';return}
  if(sd.checked)await seedAll();
  await R('config').update({pinAdmin:a});S.who='admin';lsSet('pl_pin',a);render()}
async function seedAll(){
  const u={};
  Object.entries(SEED.talhoes).forEach(([k,v])=>u['talhoes/'+k]=v);
  Object.entries(SEED.produtos).forEach(([k,v])=>u['produtos/'+k]=v);
  Object.entries(SEED.equip).forEach(([k,v])=>u['equipamentos/'+k]=v);
  u['config/ordem']=SEED.ordem;u['config/notaCalda']=SEED.notaCalda;u['config/osSeq']=0;
  const sid='s2026';u['safras/'+sid]={nome:SEED.safra.nome,ativa:true,talhoes:SEED.safra.talhoes};
  SEED.aplicacoes.forEach(a=>{if(a.estagio==='Micron'){const pl=SEED.safra.talhoes[a.talhao]?.plantio;if(pl){a={...a,status:'realizada',data:pl}}}const id=uid();u['aplicacoes/'+id]={safra:sid,talhao:a.talhao,estagio:a.estagio,entrada:estOrd(a.estagio)+1,dataPrev:a.data||'',prods:a.prods,status:a.status,dataReal:a.status==='realizada'?a.data:''}});
  await R().update(u);S.safra=sid;toast('Dados iniciais importados');
}
function renderGate(m){m.innerHTML='<div class="gate card"><h2>Plantio São Simão</h2><p class="mu sm-t" style="margin:0">Digite o PIN de administrador</p><input id="pin" inputmode="numeric" type="password" maxlength="8" onkeydown="if(event.key===\'Enter\')gate()"><div class="err" id="e"></div><button class="pri" onclick="gate()">Entrar</button><a class="sm-t mu" href="#op">Sou operador</a></div>';pin.focus()}
function gate(){if(pin.value.trim()===D().config.pinAdmin){S.who='admin';lsSet('pl_pin',pin.value.trim());render()}else{e.textContent='PIN incorreto.';pin.value=''}}

/* ============ PAINEL ============ */
function statusPill(a){if(a.status==='realizada')return '<span class="pill p-ok">realizada '+dt(a.dataReal)+'</span>';if(a.status==='em_os')return '<span class="pill p-in">em OS nº '+(D().os?.[a.osId]?.num||'')+'</span>';if(!a.dataPrev)return '<span class="pill">sem data</span>';const k=dias(hoje(),a.dataPrev);if(k<0)return '<span class="pill p-er">atrasada '+(-k)+'d</span>';if(k<=3)return '<span class="pill p-wa">em '+k+'d</span>';return '<span class="pill p-ac">em '+k+'d</span>'}
function vPainel(m){
  if(!safra()){m.innerHTML='<div class="card empty">Nenhuma safra cadastrada. Crie uma em Cadastros.</div>';return}
  const A=apls(),hj=hoje();
  const prox=A.filter(a=>a.status!=='realizada'&&a.dataPrev).sort((a,b)=>a.dataPrev.localeCompare(b.dataPrev));
  const sem7=prox.filter(a=>dias(hj,a.dataPrev)<=7);
  const atras=prox.filter(a=>dias(hj,a.dataPrev)<0&&a.status==='planejada');
  const abertas=oss().filter(o=>o.status==='aberta');
  const real=A.filter(a=>a.status==='realizada').length;
  const hl=sem7.map(a=>a.talhao);
  let rows='';
  talhoes().forEach(t=>{const st=stal(t.n);const my=A.filter(a=>a.talhao===t.n);const ult=my.filter(a=>a.status==='realizada').sort((a,b)=>(b.dataReal||'').localeCompare(a.dataReal||''))[0];const nx=my.filter(a=>a.status!=='realizada'&&a.dataPrev).sort((a,b)=>a.dataPrev.localeCompare(b.dataPrev))[0];
    let lib='–';const cs=my.filter(a=>a.status==='realizada'&&a.dataReal&&(!st.plantio||a.dataReal>=st.plantio)).map(a=>({d:addD(a.dataReal,carencia(a)),c:carencia(a)})).filter(x=>x.c>0).sort((a,b)=>b.d.localeCompare(a.d))[0];if(cs)lib=(cs.d>hj?'<span class="pill p-wa">'+dt(cs.d)+'</span>':'<span class="pill p-ok">liberado</span>');
    rows+='<tr><td><b>'+t.n+'</b></td><td>'+h(st.cultura||'')+' <span class="mu">'+h(st.variedade||'')+'</span></td><td class="n">'+nf(haT(t.n))+'</td><td>'+(st.plantio?dt(st.plantio)+' <span class="mu">· '+dias(st.plantio,hj)+' DAP</span>':'<span class="mu">a plantar</span>')+'</td><td>'+(ult?h(lbl(ult))+' <span class="mu">'+dt(ult.dataReal)+'</span>':'–')+'</td><td>'+(nx?h(lbl(nx))+' '+statusPill(nx):'–')+'</td><td>'+lib+'</td></tr>'});
  m.innerHTML='<div class="row"><h2>'+h(safra().nome)+'</h2><span class="sp"></span><span class="mu sm-t">Hoje, '+dt(hj)+'</span></div>'+
  '<div class="grid g4"><div class="kpi"><b>'+sem7.length+'</b><span>aplicações nos próximos 7 dias</span></div><div class="kpi"><b>'+abertas.length+'</b><span>ordens de serviço abertas</span></div><div class="kpi"><b style="color:'+(atras.length?'var(--er)':'inherit')+'">'+atras.length+'</b><span>aplicações atrasadas sem OS</span></div><div class="kpi"><b>'+real+'</b><span>aplicações realizadas na safra</span></div></div>'+
  '<div class="grid g2"><div class="card"><div class="row" style="margin-bottom:8px"><h3>Próximas aplicações</h3><span class="sp"></span><button class="sm" onclick="go(\'os\');novaOS()">Nova OS</button></div><div class="tw"><table><thead><tr><th>Data</th><th>Talhão</th><th>Entrada</th><th>Situação</th></tr></thead><tbody>'+
  (prox.slice(0,14).map(a=>'<tr><td>'+dt(a.dataPrev)+'</td><td>'+a.talhao+'</td><td>'+h(lbl(a))+'</td><td>'+statusPill(a)+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">Nenhuma aplicação com data prevista.</td></tr>')+
  '</tbody></table></div></div><div class="card"><h3 style="margin-bottom:8px">Talhões com aplicação nos próximos 7 dias</h3>'+mapa(hl)+'</div></div>'+
  '<div class="card"><h3 style="margin-bottom:8px">Situação dos talhões</h3><div class="tw"><table><thead><tr><th>Talhão</th><th>Cultura</th><th class="n">ha</th><th>Plantio</th><th>Última aplicação</th><th>Próxima</th><th>Carência</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="mu sm-t" style="margin:8px 0 0">Carência: data em que o talhão fica liberado para colheita, pela maior carência dos produtos aplicados depois do plantio que têm carência cadastrada.</p></div>';
}

/* ============ PLANEJAMENTO ============ */
function cellCls(a){if(a.status==='realizada')return ['ok','✓ '+dt(a.dataReal)];if(a.status==='em_os')return ['in','OS '+(D().os?.[a.osId]?.num||'')];if(!a.dataPrev)return ['sd','sem data'];const k=dias(hoje(),a.dataPrev);if(k<0)return ['er',dt(a.dataPrev)];if(k<=3)return ['wa',dt(a.dataPrev)];return ['pl',dt(a.dataPrev)]}
function culturaOk(n){return !S.pc||(stal(n).cultura||'')===S.pc}
function vPlan(m){
  if(!safra()){m.innerHTML='<div class="card empty">Nenhuma safra. Crie uma em Cadastros.</div>';return}
  const A=apls();const ests=[...new Set(A.map(ent))].sort((a,b)=>a-b);
  const culturas=[...new Set(talhoes().map(t=>stal(t.n).cultura).filter(Boolean))];
  let html='<div class="row"><h2>Planejamento · '+h(safra().nome)+'</h2><span class="sp"></span><button onclick="modalST()">Talhões da safra</button><button class="pri" onclick="novaApl()">Nova aplicação</button></div>';
  html+='<div class="row"><nav class="tabs">'+[['','Todas']].concat(culturas.map(c=>[c,c])).map(([k,l])=>'<button class="'+((S.pc||'')===k?'on':'')+'" onclick="S.pc=\''+k+'\';render()">'+l+'</button>').join('')+'</nav><label class="chk"><input type="checkbox" '+(S.hr?'checked':'')+' onchange="S.hr=this.checked;render()"> esconder realizadas</label></div>';
  // grade
  const TL=talhoes().filter(t=>culturaOk(t.n));
  html+='<div class="card"><h3 style="margin-bottom:4px">Grade da safra</h3><p class="mu sm-t" style="margin:0 0 8px">Clique numa célula para abrir a aplicação, numa célula vazia para criar uma, ou no nome da entrada para editar a observação de cada cultura.</p><div class="tw"><table class="grade"><thead><tr><th>Talhão</th>'+ests.map(e=>'<th class="eh" onclick="obsModal('+e+')" title="Editar observação">'+entL(e)+'<span>'+obsResumo(A,e)+'</span></th>').join('')+'</tr></thead><tbody>';
  TL.forEach(t=>{html+='<tr><td class="gt"><b>'+t.n+'</b> <span class="mu sm-t">'+h((stal(t.n).cultura||'').toLowerCase())+'</span></td>';
    ests.forEach(e=>{const L=A.filter(a=>a.talhao===t.n&&ent(a)===e);if(!L.length){html+='<td class="gc ge" onclick="novaApl('+e+','+t.n+')" title="Criar aplicação"></td>';return}const a=L[0];const [c,txt]=cellCls(a);html+='<td class="gc g-'+c+'" onclick="editApl(\''+a.id+'\')">'+txt+(L.length>1?' <sup>+'+(L.length-1)+'</sup>':'')+'</td>'});html+='</tr>'});
  html+='</tbody></table></div><div class="row sm-t mu" style="margin-top:8px;gap:12px"><span><span class="pill p-ok">✓</span> realizada</span><span><span class="pill p-in">OS</span> em ordem de serviço</span><span><span class="pill p-wa">data</span> nos próximos 3 dias</span><span><span class="pill p-er">data</span> atrasada</span><span><span class="pill" style="border:1px dashed var(--ln2);background:none">sem data</span> falta lançar a data</span></div></div>';
  // receitas
  const G={};A.filter(a=>culturaOk(a.talhao)).forEach(a=>{const k=ent(a)+'§'+(a.estagio||'')+'§'+recKey(a);(G[k]=G[k]||[]).push(a)});
  let groups=Object.values(G).map(L=>L.sort((a,b)=>((a.dataReal||a.dataPrev||'9')).localeCompare(b.dataReal||b.dataPrev||'9')||a.talhao-b.talhao));
  if(S.hr)groups=groups.filter(L=>L.some(a=>a.status!=='realizada'));
  groups.sort((x,y)=>ent(x[0])-ent(y[0])||Math.min(...x.map(a=>a.talhao))-Math.min(...y.map(a=>a.talhao)));
  S.groups=groups;
  html+='<h3>Receitas</h3><div class="grid g3">';
  if(!groups.length)html+='<div class="card empty">Nenhuma aplicação para mostrar.</div>';
  groups.forEach((L,gi)=>{const cult=[...new Set(L.map(a=>stal(a.talhao).cultura).filter(Boolean))].join(' e ');const ha=L.reduce((s,a)=>s+haT(a.talhao),0);const plan=L.filter(a=>a.status==='planejada');const allDone=L.every(a=>a.status==='realizada');
    html+='<div class="card rc"><div class="row" style="gap:6px"><b>'+entL(ent(L[0]))+(cult?' · '+h(cult):'')+(L[0].estagio?' <span class="mu" style="font-weight:400">'+h(L[0].estagio)+'</span>':'')+'</b><span class="sp"></span>'+(allDone?'<span class="pill p-ok">realizada</span>':'')+'<span class="mu sm-t">'+L.length+' talhões · '+nf(ha)+' ha</span></div><div style="margin:8px 0">'+sortProds(L[0].prods||[]).map(p=>{const pr=prods()[p.p];return '<div class="pr"><span>'+h(pnome(p.p))+'</span><span class="mono">'+nf(p.dose,p.dose<0.1?3:2)+' '+(pr?.unid||'L')+'/ha</span></div>'}).join('')+'</div><div class="row" style="gap:5px">'+L.map(a=>{const [c,txt]=cellCls(a);return '<button class="chipb g-'+c+'" onclick="editApl(\''+a.id+'\')">T'+a.talhao+' · '+txt+'</button>'}).join('')+'</div>'+
    (plan.length?'<div class="row" style="gap:6px;margin-top:10px"><button class="sm" onclick="editRec('+gi+')">Editar receita</button><button class="sm" onclick="datasRec('+gi+')">Lançar datas</button><button class="sm pri" onclick="osRec('+gi+')">Gerar OS</button></div>':'')+'</div>'});
  html+='</div><p class="mu sm-t" style="margin:0">Para dar uma receita diferente a um talhão, clique na etiqueta dele e altere os produtos. Ele passa a ter um cartão próprio.</p>';
  m.innerHTML=html;
}
function modalST(){let t='<div class="mdh"><h3>Talhões da '+h(safra().nome)+'</h3><button onclick="closeM()">Fechar</button></div><div class="tw"><table><thead><tr><th>Talhão</th><th>Cultura</th><th>Variedade</th><th class="n">Sem/m</th><th class="n">ha</th><th>Plantio</th><th>Adubo plantio</th><th>Cobertura</th><th></th></tr></thead><tbody>';
  talhoes().forEach(x=>{const s=stal(x.n);t+='<tr><td><b>'+x.n+'</b></td><td>'+h(s.cultura||'–')+'</td><td>'+h(s.variedade||'–')+'</td><td class="n">'+(s.semM??'–')+'</td><td class="n">'+nf(haT(x.n))+'</td><td>'+(s.plantio?dt(s.plantio):'–')+'</td><td class="sm-t">'+h(s.adPlProd||'')+(s.adPlDose?' · '+s.adPlDose+' kg/ha':'')+'</td><td class="sm-t">'+h(s.cobProd||'')+(s.cobDose?' · '+s.cobDose+' kg/ha':'')+(s.cobData?' · '+dt(s.cobData):'')+'</td><td><button class="sm" onclick="editST('+x.n+')">Editar</button></td></tr>'});
  openM(t+'</tbody></table></div><p class="mu sm-t" style="margin:0">Ao lançar a data de plantio, o Micron do talhão fica realizado na mesma data.</p>',true)}
function editRec(gi){const L=S.groups[gi];const plan=L.filter(a=>a.status==='planejada');S.f={rec:plan.map(a=>a.id),entrada:ent(L[0]),estagio:L[0].estagio||'',prods:(L[0].prods||[]).map(p=>({...p}))};recForm()}
function recForm(){const f=S.f;openM('<div class="mdh"><h3>Editar receita · '+h(entL(f.entrada))+'</h3><button onclick="closeM()">Fechar</button></div><p class="mu sm-t" style="margin:0">Vale para os talhões planejados deste cartão: '+f.rec.map(id=>'T'+D().aplicacoes[id].talhao).join(', ')+'. Os já realizados e os em OS não mudam.</p><div class="grid g4">'+'<label class="f">Entrada<select onchange="S.f.entrada=+this.value">'+Array.from({length:12},(_,i)=>i+1).map(n=>'<option value="'+n+'"'+(n===f.entrada?' selected':'')+'>'+entL(n)+'</option>').join('')+'</select></label><label class="f">Observação<input list="estl" placeholder="ex.: V3‑V4, 20 DAP" value="'+h(f.estagio||'')+'" oninput="S.f.estagio=this.value"><datalist id="estl">'+ESTAGIOS.map(e=>'<option value="'+e+'">').join('')+'</datalist></label>'+'</div>'+prodRows('recForm()')+'<div class="err" id="ae"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveRec()">Salvar receita</button></div>')}
function prodRows(re){const f=S.f;return '<div><div class="row" style="margin-bottom:6px"><span class="mu sm-t">Produtos e dose por hectare</span><span class="sp"></span><button class="sm" onclick="S.f.prods.push({p:\'\',dose:\'\'});'+re+'">Adicionar produto</button></div><div class="grid" style="gap:6px">'+f.prods.map((p,i)=>{const pr=prods()[p.p];return '<div class="row" style="flex-wrap:nowrap"><select style="flex:2" onchange="S.f.prods['+i+'].p=this.value;'+re+'">'+prodOptions(p.p)+'</select><input style="flex:1;max-width:120px" inputmode="decimal" placeholder="dose" value="'+h(p.dose)+'" oninput="S.f.prods['+i+'].dose=this.value"><span class="mu sm-t" style="width:44px">'+(pr?pr.unid+'/ha':'')+'</span><button class="sm dg" aria-label="Remover" onclick="S.f.prods.splice('+i+',1);'+re+'">✕</button></div>'}).join('')+'</div></div>'}
function saveRec(){const f=S.f;const pr=f.prods.filter(p=>p.p).map(p=>({p:p.p,dose:num(p.dose)}));if(!pr.length||pr.some(p=>p.dose==null)){ae.textContent='Cada produto precisa de dose.';return}const u={};f.rec.forEach(id=>{u['aplicacoes/'+id+'/prods']=pr;u['aplicacoes/'+id+'/estagio']=f.estagio.trim();u['aplicacoes/'+id+'/entrada']=f.entrada});R().update(u);closeM();toast('Receita salva em '+f.rec.length+' talhões')}
function datasRec(gi){const L=S.groups[gi].filter(a=>a.status==='planejada');S.f={};openM('<div class="mdh"><h3>Datas previstas · '+h(lbl(L[0]))+'</h3><button onclick="closeM()">Fechar</button></div><div class="grid" style="gap:6px">'+L.map(a=>{const pl=stal(a.talhao).plantio;return '<div class="row" style="flex-wrap:nowrap"><b style="width:90px">Talhão '+a.talhao+'</b><input type="date" class="dtr" data-id="'+a.id+'" value="'+h(a.dataPrev||'')+'" style="max-width:190px" oninput="this.nextElementSibling.textContent=(this.value&&\''+pl+'\'?dias(\''+pl+'\',this.value)+\' DAP\':\'\')"><span class="mu sm-t">'+(pl&&a.dataPrev?dias(pl,a.dataPrev)+' DAP':'')+'</span></div>'}).join('')+'</div><div class="row"><button class="sm" onclick="const v=document.querySelector(\'.dtr\').value;document.querySelectorAll(\'.dtr\').forEach(i=>i.value=v)">Usar a primeira data em todos</button><span class="sp"></span><button class="pri" onclick="saveDatas()">Salvar datas</button></div>')}
function saveDatas(){const u={};document.querySelectorAll('.dtr').forEach(i=>u['aplicacoes/'+i.dataset.id+'/dataPrev']=i.value);R().update(u);closeM();toast('Datas salvas')}
function osRec(gi){const L=S.groups[gi].filter(a=>a.status==='planejada');go('os');novaOS();L.forEach(a=>{if(!S.f.sel.includes(a.id))S.f.sel.push(a.id)});const d=L.map(a=>a.dataPrev).filter(Boolean).sort()[0];if(d)S.f.data=d;osForm()}
function syncEntradas(){const u={};vals(D().aplicacoes).forEach(a=>{if(!a.entrada)u['aplicacoes/'+a.id+'/entrada']=ent(a)});vals(D().os).forEach(o=>{if(!o.entrada)u['os/'+o.id+'/entrada']=ent(o)});if(Object.keys(u).length)R().update(u)}
function obsResumo(A,e){const m={};A.filter(a=>ent(a)===e).forEach(a=>{const c=stal(a.talhao).cultura||'Sem cultura';(m[c]=m[c]||new Set()).add(a.estagio||'')});const cs=Object.keys(m);const all=new Set(cs.flatMap(c=>[...m[c]]));if(all.size===1&&[...all][0])return h([...all][0]);if(all.size===1)return '<i>sem observação</i>';return cs.map(c=>h(c)+': '+([...m[c]].filter(Boolean).map(h).join(', ')||'–')).join('<br>')}
function obsModal(e){const A=apls().filter(a=>ent(a)===e);const cs=[...new Set(A.map(a=>stal(a.talhao).cultura||'Sem cultura'))];S.f={e};
 openM('<div class="mdh"><h3>Observação · '+entL(e)+'</h3><button onclick="closeM()">Fechar</button></div><p class="mu sm-t" style="margin:0">Cada cultura pode ter o seu estágio nesta entrada. O texto aparece embaixo do nome da coluna, nos cartões e na cola.</p><div class="grid" style="gap:8px">'+cs.map(c=>{const ex=[...new Set(A.filter(a=>(stal(a.talhao).cultura||'Sem cultura')===c).map(a=>a.estagio||''))];return '<label class="f">'+h(c)+'<input class="obsc" data-c="'+h(c)+'" list="estl" value="'+h(ex.length===1?ex[0]:'')+'" placeholder="'+(ex.length>1?'vários: '+h(ex.join(', ')):'ex.: V3‑V4, 20 DAP')+'"></label>'}).join('')+'<datalist id="estl">'+ESTAGIOS.map(x=>'<option value="'+x+'">').join('')+'</datalist></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveObs()">Salvar</button></div>')}
function saveObs(){const e=S.f.e;const u={};document.querySelectorAll('.obsc').forEach(i=>{const c=i.dataset.c,v=i.value.trim();if(!v&&i.placeholder.startsWith('vários'))return;apls().filter(a=>ent(a)===e&&(stal(a.talhao).cultura||'Sem cultura')===c).forEach(a=>{u['aplicacoes/'+a.id+'/estagio']=v})});R().update(u);closeM();toast('Observação salva')}
function syncMicron(){if(!safra())return;const u={};apls().forEach(a=>{if(!/micron/i.test(a.estagio||'')||a.status==='em_os')return;const pl=stal(a.talhao).plantio;if(pl&&(a.status!=='realizada'||a.dataReal!==pl)){u['aplicacoes/'+a.id+'/status']='realizada';u['aplicacoes/'+a.id+'/dataReal']=pl;u['aplicacoes/'+a.id+'/dataPrev']=pl}if(!pl&&a.status==='realizada'){u['aplicacoes/'+a.id+'/status']='planejada';u['aplicacoes/'+a.id+'/dataReal']='';u['aplicacoes/'+a.id+'/dataPrev']=''}});if(Object.keys(u).length)R().update(u)}
function editST(n){const s=stal(n);S.f={n};openM('<div class="mdh"><h3>Talhão '+n+' na '+h(safra().nome)+'</h3><button onclick="closeM()">Fechar</button></div><div class="grid g4">'+
 '<label class="f">Cultura<select id="cu">'+['','Soja','Milho','Sorgo','Trigo','Feijão','Pousio'].map(c=>'<option'+(c===(s.cultura||'')?' selected':'')+'>'+c+'</option>').join('')+'</select></label>'+
 '<label class="f">Variedade<input id="va" value="'+h(s.variedade||'')+'"></label><label class="f">Sementes por metro<input id="sm" inputmode="decimal" value="'+h(s.semM??'')+'"></label><label class="f">Hectares<input id="ha" inputmode="decimal" value="'+h(s.ha??haT(n))+'"></label>'+

 html+='<div><div class="row" style="margin-bottom:6px"><span class="mu sm-t">Produtos e dose por hectare</span><span class="sp"></span><button class="sm" onclick="S.f.prods.push({p:\'\',dose:\'\'});aplForm('+isNew+')">Adicionar produto</button></div><div class="grid" style="gap:6px">'+
  f.prods.map((p,i)=>{const pr=prods()[p.p];return '<div class="row" style="flex-wrap:nowrap"><select style="flex:2" onchange="S.f.prods['+i+'].p=this.value;aplForm('+isNew+')">'+prodOptions(p.p)+'</select><input style="flex:1;max-width:120px" inputmode="decimal" placeholder="dose" value="'+h(p.dose)+'" oninput="S.f.prods['+i+'].dose=this.value"><span class="mu sm-t" style="width:44px">'+(pr?pr.unid+'/ha':'')+'</span><button class="sm dg" aria-label="Remover" onclick="S.f.prods.splice('+i+',1);aplForm('+isNew+')">✕</button></div>'}).join('')+'</div></div><div class="err" id="ae"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveApl('+isNew+')">Salvar</button></div>';
 openM(html)}

function vOS(m){
  const L=oss();const ab=L.filter(o=>o.status==='aberta'),fe=L.filter(o=>o.status!=='aberta');

 const sel=f.sel.map(id=>D().aplicacoes[id]);const keys=new Set(sel.map(recKey));const mix=keys.size>1;
 const groups={};A.forEach(a=>{const k=lbl(a)+'|'+(a.dataPrev||'');(groups[k]=groups[k]||[]).push(a)});
 let list=Object.entries(groups).map(([k,L])=>{const[e,d]=k.split('|');return '<div style="margin-bottom:8px"><div class="sm-t mu" style="margin-bottom:4px">'+h(e)+' · '+(d?dt(d):'sem data')+'</div><div class="row">'+L.map(a=>'<label class="chk"><input type="checkbox" '+(f.sel.includes(a.id)?'checked':'')+' onchange="togA(\''+a.id+'\',this.checked)"> T'+a.talhao+' <span class="mu sm-t">'+nf(haT(a.talhao))+' ha</span></label>').join('')+'</div></div>'}).join('')||'<div class="empty">Nenhuma aplicação planejada disponível.</div>';
 const eqs=vals(D().equipamentos),ops=vals(D().operadores);
 let ordemT=sel.length?'<div><div class="mu sm-t" style="margin-bottom:4px">Ordem dos talhões na aplicação</div><div class="grid" style="gap:4px">'+sel.map((a,i)=>'<div class="row chk" style="cursor:default"><b>'+(i+1)+'.</b> Talhão '+a.talhao+' <span class="mu sm-t">'+nf(haT(a.talhao))+' ha</span><span class="sp"></span><button class="sm" onclick="mvA('+i+',-1)" aria-label="Subir">↑</button><button class="sm" onclick="mvA('+i+',1)" aria-label="Descer">↓</button></div>').join('')+'</div></div>':'';
 openM('<div class="mdh"><h3>Nova ordem de serviço</h3><button onclick="closeM()">Fechar</button></div><div><div class="mu sm-t" style="margin-bottom:6px">Marque as aplicações que saem juntas. Elas precisam ter a mesma receita.</div>'+list+'</div>'+(mix?'<div class="warn">Os talhões marcados têm receitas diferentes. Faça uma OS para cada receita, ou ajuste a receita no Planejamento.</div>':'')+ordemT+
 '<div class="grid g4"><label class="f">Equipamento<select onchange="S.f.equip=this.value;S.f.vazao=D().equipamentos[this.value].vazao;osForm()">'+eqs.map(e=>'<option value="'+e.id+'"'+(e.id===f.equip?' selected':'')+'>'+h(e.nome)+'</option>').join('')+'</select></label><label class="f">Vazão (L/ha)<input inputmode="decimal" value="'+h(f.vazao)+'" oninput="S.f.vazao=this.value"></label><label class="f">Operador<select onchange="S.f.oper=this.value"><option value="">a definir</option>'+ops.map(o=>'<option value="'+o.id+'"'+(o.id===f.oper?' selected':'')+'>'+h(o.nome)+'</option>').join('')+'</select></label><label class="f">Data<input type="date" value="'+h(f.data)+'" oninput="S.f.data=this.value"></label></div><div class="err" id="oe"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveOS()">Criar OS</button></div>',true)}

 if(!sel.length){oe.textContent='Marque pelo menos uma aplicação.';return}if(new Set(sel.map(recKey)).size>1){oe.textContent='As aplicações marcadas têm receitas diferentes.';return}if(!eq){oe.textContent='Cadastre um equipamento.';return}if(!vz){oe.textContent='Informe a vazão.';return}
 const r=await R('config/osSeq').transaction(x=>(x||0)+1);const n=r.snapshot.val();const id=uid();
 const o={num:n,safra:S.safra,entrada:ent(sel[0]),estagio:sel[0].estagio||'',data:f.data||'',equip:f.equip,cap:eq.cap,vazao:vz,reg:eq.reg||'',oper:f.oper||'',talhoes:sel.map(a=>({n:a.talhao,ha:haT(a.talhao),apl:a.id})),prods:sel[0].prods,status:'aberta',criada:Date.now()};
 const u={['os/'+id]:o};sel.forEach(a=>{u['aplicacoes/'+a.id+'/status']='em_os';u['aplicacoes/'+a.id+'/osId']=id});await R().update(u);closeM();toast('OS nº '+n+' criada');verCola(id)}

function colaHTML(o,interativo){
  const bb=bombas(o.talhoes,o.cap,o.vazao);const tot=o.talhoes.reduce((s,t)=>s+t.ha,0);const ult=bb.list[bb.list.length-1];const parcial=ult&&ult.ha<bb.hpb-1e-6;
  const ps=sortProds(o.prods||[]);const feitas=o.feitas||{};const semForm=ps.filter(p=>!prods()[p.p]||prods()[p.p].form==='?');
  let s='<div class="cola"><div class="ch"><div><small>Fazenda São Simão · Ordem nº '+o.num+' · '+h(D().safras?.[o.safra]?.nome||'')+'</small><b>'+h(lbl(o))+' · Talhões '+o.talhoes.map(t=>t.n).join(' e ').replace(/ e (?=.* e )/g,', ')+' · '+nf(tot)+' ha</b></div><div style="text-align:right"><small>Prevista</small><b>'+dt(o.data)+'</b></div></div><div class="cb"><div>'+mapa(o.talhoes.map(t=>t.n))+'</div><div style="display:grid;gap:8px">';
  s+='<div class="tbx">'+o.talhoes.map(t=>{const st=D().safras?.[o.safra]?.talhoes?.[t.n]||{};return '<div class="tb"><span style="color:#5c6656">Talhão '+t.n+(st.variedade?' · '+h(st.variedade):'')+'</span><b>'+nf(t.ha)+' ha</b></div>'}).join('')+'</div>';
  s+='<div class="reg">'+h(D().equipamentos?.[o.equip]?.nome||(o.cap+' L'))+' · '+nf(o.vazao,0)+' L/ha · '+h(o.reg||'')+(D().config?.notaCalda?' · '+h(D().config.notaCalda):'')+'</div>';
  s+='<table><thead><tr><th>Produto</th><th class="n">Dose/ha</th><th class="n">Bomba cheia</th>'+(parcial&&bb.list.length>1?'<th class="n">Última bomba</th>':'')+'<th class="n">Total</th></tr></thead><tbody>'+ps.map((p,i)=>{const pr=prods()[p.p]||{};const u=pr.unid||'L';return '<tr><td>'+(i+1)+'. '+h(pr.nome||p.p)+(pr.obs&&pr.st!=='warn'?'<span class="pm">'+h(pr.obs)+'</span>':'')+'</td><td class="n">'+nf(p.dose,p.dose<0.1?3:2)+'</td><td class="n"><b>'+nf(p.dose*Math.min(bb.hpb,tot))+' '+u+'</b></td>'+(parcial&&bb.list.length>1?'<td class="n">'+nf(p.dose*ult.ha)+' '+u+'</td>':'')+'<td class="n">'+nf(p.dose*tot)+' '+u+'</td></tr>'}).join('')+'</tbody></table>';
  if(semForm.length)s+='<div class="pm">Sem formulação cadastrada, colocar por último e conferir a bula: '+semForm.map(p=>h(pnome(p.p))).join(', ')+'</div>';
  s+='<div style="display:grid;gap:5px">'+bb.list.map((b,i)=>{const pa=b.ha<bb.hpb-1e-6;const dn=!!feitas[i];const segs=b.seg.map(x=>'T'+x.n+' '+nf(x.ha)+' ha').join(' + ');return (interativo&&o.status==='aberta'?'<label class="bb'+(pa?' pa':'')+(dn?' done':'')+'" style="cursor:pointer"><input type="checkbox" style="width:18px;height:18px" '+(dn?'checked':'')+' onchange="marcaB(\''+o.id+'\','+i+',this.checked)">':'<div class="bb'+(pa?' pa':'')+(dn?' done':'')+'"><span class="bx"></span>')+'<span><b>Bomba '+(i+1)+'</b> · '+nf(b.ha*o.vazao,0)+' L · '+segs+(pa&&bb.list.length>1?' · usar coluna "Última bomba"':'')+'</span>'+(interativo&&o.status==='aberta'?'</label>':'</div>')}).join('')+'</div>';
  s+='</div></div>';
  if(o.status==='realizada'&&o.real)s+='<div class="reg" style="background:#e1f0e3;color:#2d6a37">Realizada em '+dt(o.real.data)+(o.real.ini?' · '+h(o.real.ini)+' às '+h(o.real.fim):'')+(o.real.vento!=null?' · vento '+o.real.vento+' km/h':'')+(o.real.temp!=null?' · '+o.real.temp+' °C':'')+(o.real.umid!=null?' · UR '+o.real.umid+'%':'')+(o.real.por?' · '+h(o.real.por):'')+(o.real.obs?' · '+h(o.real.obs):'')+'</div>';
  else if(!interativo)s+='<div class="ff"><div>Data real</div><div>Início / fim</div><div>Vento / temperatura / UR</div><div>Operador</div></div>';
  return s+'</div>'}

function saveReal(){const f=S.f,o=D().os[f.id];if(!rd.value){re.textContent='Informe a data.';return}
 const v=num(rv.value),t=num(rt.value),u=num(ru.value);const al=[];if(v!=null&&(v<3||v>10))al.push('vento fora de 3 a 10 km/h');if(t!=null&&t>30)al.push('temperatura acima de 30 °C');if(u!=null&&u<55)al.push('umidade abaixo de 55%');
 if(al.length&&!f.ok){f.ok=true;rw.innerHTML='<div class="warn">Condição fora do ideal: '+al.join(', ')+'. Toque em "Encerrar OS" de novo para registrar assim mesmo.</div>';return}
 const real={data:rd.value,ini:ri.value,fim:rf.value,vento:v,temp:t,umid:u,obs:ro.value.trim(),por:f.admin?'registrado no escritório':(D().operadores?.[S.who]?.nome||'')};
 const up={['os/'+f.id+'/status']:'realizada',['os/'+f.id+'/real']:real};o.talhoes.forEach(x=>{up['aplicacoes/'+x.apl+'/status']='realizada';up['aplicacoes/'+x.apl+'/dataReal']=rd.value});R().update(up);closeM();toast('OS nº '+o.num+' encerrada')}

function renderOp(m){
  if(!S.who&&!S.saiu){const lp=lsGet('pl_op');if(lp){if(lp===D().config?.pinAdmin)S.who='admin';else{const op=vals(D().operadores).find(o=>String(o.pin)===lp&&o.ativo!==false);if(op)S.who=op.id}}}
  if(!S.who){m.innerHTML='<div class="gate card"><h2>Ordens de aplicação</h2><p class="mu sm-t" style="margin:0">Fazenda São Simão · digite seu PIN</p><input id="pin" inputmode="numeric" type="password" maxlength="8" onkeydown="if(event.key===\'Enter\')gateOp()"><div class="err" id="e"></div><button class="pri" onclick="gateOp()">Entrar</button></div>';setTimeout(()=>window.pin&&pin.focus(),50);return}
  const meus=vals(D().os).filter(o=>o.status==='aberta'&&(S.who==='admin'||!o.oper||o.oper===S.who)).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  const nome=S.who==='admin'?'Administrador':(D().operadores?.[S.who]?.nome||'');
  if(S.opOS&&!meus.find(o=>o.id===S.opOS))S.opOS=null;
  if(S.opOS){const o=meus.find(x=>x.id===S.opOS);m.innerHTML='<div class="row"><button onclick="S.opOS=null;render()">← Voltar</button><span class="sp"></span><span class="mu sm-t">'+h(nome)+'</span></div>'+colaHTML(o,true)+'<button class="pri" style="padding:12px" onclick="fecharOS(\''+o.id+'\',false)">Terminei · registrar a aplicação</button>';return}
  m.innerHTML='<div class="row"><h2>Olá, '+h(nome.split(' ')[0])+'</h2><span class="sp"></span><button class="sm" onclick="S.who=null;S.saiu=true;lsSet(\'pl_op\',\'\');render()">Sair</button></div>'+(meus.map(o=>'<button class="card" style="text-align:left;display:grid;gap:4px" onclick="S.opOS=\''+o.id+'\';render()"><span class="row"><b>OS nº '+o.num+' · '+h(lbl(o))+'</b><span class="sp"></span><span class="pill p-in">'+dt(o.data)+'</span></span><span>Talhões '+o.talhoes.map(t=>t.n).join(', ')+' · '+nf(o.talhoes.reduce((s,t)=>s+t.ha,0))+' ha</span><span class="mu sm-t">Bombas feitas: '+cnt(o.feitas)+' de '+bombas(o.talhoes,o.cap,o.vazao).list.length+'</span></button>').join('')||'<div class="card empty">Nenhuma ordem aberta para você agora.</div>');
}
function gateOp(){const p=pin.value.trim();S.saiu=false;if(p&&p===D().config?.pinAdmin){S.who='admin';lsSet('pl_op',p);render();return}const op=vals(D().operadores).find(o=>String(o.pin)===p&&o.ativo!==false);if(op){S.who=op.id;lsSet('pl_op',p);render()}else{e.textContent='PIN não encontrado.';pin.value=''}}

/* ============ COLHEITA ============ */
function vColheita(m){
  if(!safra()){m.innerHTML='<div class="card empty">Nenhuma safra.</div>';return}
  const C=vals(D().colheita).filter(c=>c.safra===S.safra).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  let tot=0,haTot=0;let rows=talhoes().map(t=>{const L=C.filter(c=>c.talhao===t.n);if(!L.length&&!stal(t.n).cultura)return '';const kg=L.reduce((s,c)=>s+(c.kg||0),0);const ha=haT(t.n);if(kg){tot+=kg;haTot+=ha}return '<tr><td><b>'+t.n+'</b></td><td>'+h(stal(t.n).cultura||'')+' <span class="mu">'+h(stal(t.n).variedade||'')+'</span></td><td class="n">'+L.length+'</td><td class="n">'+nf(kg,0)+'</td><td class="n">'+nf(kg/60,0)+'</td><td class="n"><b>'+(kg?nf(kg/60/ha,1):'–')+'</b></td></tr>'}).join('');
  rows+='<tr class="gh"><td colspan="3">Total colhido</td><td class="n">'+nf(tot,0)+'</td><td class="n">'+nf(tot/60,0)+'</td><td class="n">'+(haTot?nf(tot/60/haTot,1):'–')+'</td></tr>';
  m.innerHTML='<div class="row"><h2>Colheita · '+h(safra().nome)+'</h2><span class="sp"></span><button class="pri" onclick="novaCarga()">Lançar carga</button></div><div class="card"><div class="tw"><table><thead><tr><th>Talhão</th><th>Cultura</th><th class="n">Cargas</th><th class="n">Peso líquido (kg)</th><th class="n">Sacas 60 kg</th><th class="n">sc/ha</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="mu sm-t" style="margin:8px 0 0">Peso líquido já descontado de umidade e impureza, como sai no ticket da balança.</p></div><div class="card"><h3 style="margin-bottom:8px">Cargas lançadas</h3><div class="tw"><table><thead><tr><th>Data</th><th>Talhão</th><th>Ticket</th><th class="n">Peso líquido (kg)</th><th></th></tr></thead><tbody>'+(C.map(c=>'<tr><td>'+dt(c.data)+'</td><td>'+c.talhao+'</td><td>'+h(c.ticket||'')+'</td><td class="n">'+nf(c.kg,0)+'</td><td><button class="sm dg" onclick="delCarga(\''+c.id+'\')">Excluir</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">Nenhuma carga lançada.</td></tr>')+'</tbody></table></div></div>';
}
function novaCarga(){openM('<div class="mdh"><h3>Lançar carga</h3><button onclick="closeM()">Fechar</button></div><div class="grid g4"><label class="f">Talhão<select id="ct">'+talhoes().map(t=>'<option value="'+t.n+'">'+t.n+'</option>').join('')+'</select></label><label class="f">Data<input type="date" id="cdt2" value="'+hoje()+'"></label><label class="f">Ticket da balança<input id="ctk"></label><label class="f">Peso líquido (kg)<input id="ckg" inputmode="decimal"></label></div><div class="err" id="ce"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveCarga()">Salvar</button></div>')}
function saveCarga(){const kg=num(ckg.value);if(!kg){ce.textContent='Informe o peso líquido.';return}R('colheita/'+uid()).set({safra:S.safra,talhao:+ct.value,data:cdt2.value,ticket:ctk.value.trim(),kg});closeM();toast('Carga lançada')}
function delCarga(id){ask('Excluir esta carga?','Excluir',()=>R('colheita/'+id).remove())}

/* ============ CADASTROS ============ */
function vCad(m){
  const sub=S.cad||'prod';const T=[['prod','Produtos'],['ordem','Ordem no tanque'],['equip','Equipamentos'],['oper','Operadores'],['tal','Talhões'],['safra','Safras'],['cfg','Acesso']];
  let html='<div class="row"><h2>Cadastros</h2></div><nav class="tabs">'+T.map(([k,l])=>'<button class="'+(sub===k?'on':'')+'" onclick="S.cad=\''+k+'\';render()">'+l+'</button>').join('')+'</nav>';
  if(sub==='prod'){const P=vals(prods()).filter(p=>!p.excluido).filter(p=>!S.pw||p.st==='warn').sort((a,b)=>CLASSES.indexOf(a.classe)-CLASSES.indexOf(b.classe)||a.nome.localeCompare(b.nome));
    html+='<div class="card"><div class="row" style="margin-bottom:8px"><input style="max-width:240px" placeholder="Buscar produto ou ativo" value="'+h(S.pq||'')+'" oninput="fp(this.value)"><label class="chk"><input type="checkbox" '+(S.pw?'checked':'')+' onchange="S.pw=this.checked;render()"> só para conferir</label><span class="sp"></span><button class="pri" onclick="editProd()">Novo produto</button></div><div class="tw"><table><thead><tr><th>Produto</th><th>Ingrediente ativo</th><th>Form.</th><th>Tanque</th><th>Carência S / M</th><th>Situação</th><th></th></tr></thead><tbody>';
    let last='';P.forEach(p=>{if(p.classe!==last){html+='<tr class="gh"><td colspan="7">'+h(p.classe)+'</td></tr>';last=p.classe}const gi=ordem().indexOf(grp(p.form));html+='<tr data-q="'+h((p.nome+' '+(p.ativo||'')).toLowerCase())+'"'+(S.pq&&!(p.nome+' '+(p.ativo||'')).toLowerCase().includes(S.pq.toLowerCase())?' hidden':'')+'><td><b>'+h(p.nome)+'</b> <span class="mu sm-t">'+h(p.unid)+'</span></td><td class="sm-t">'+h(p.ativo||'')+(p.obs?'<div class="mu">'+h(p.obs)+'</div>':'')+'</td><td class="mono">'+(p.form==='?'?'<span class="pill p-wa">definir</span>':h(p.form))+'</td><td class="mono">'+(gi<0?'–':(gi+1))+'</td><td class="n">'+(p.carS??'–')+' / '+(p.carM??'–')+'</td><td>'+({ok:'<span class="pill p-ok">bula conferida</span>',known:'<span class="pill p-in">registro conhecido</span>',warn:'<span class="pill p-wa">conferir</span>'}[p.st]||'')+'</td><td class="row" style="gap:4px;flex-wrap:nowrap"><button class="sm" onclick="editProd(\''+p.id+'\')">Editar</button><button class="sm dg" onclick="delProd(\''+p.id+'\')">Excluir</button></td></tr>'});
    html+='</tbody></table></div></div>'}
  if(sub==='ordem'){const o=ordem();html+='<div class="card" style="max-width:560px"><p class="mu sm-t" style="margin:0 0 10px">Ordem em que os grupos de formulação entram no tanque. Vale para todas as colas. A bula de cada produto tem prioridade quando disser outra coisa.</p><div class="grid" style="gap:5px">'+o.map((g,i)=>'<div class="row chk" style="cursor:default"><b class="mono" style="width:22px">'+(i+1)+'</b>'+h(GRUPOS[g]||g)+'<span class="sp"></span><button class="sm" onclick="mvO('+i+',-1)" aria-label="Subir">↑</button><button class="sm" onclick="mvO('+i+',1)" aria-label="Descer">↓</button></div>').join('')+'</div><label class="f" style="margin-top:12px">Nota da calda (sai em todas as colas)<input value="'+h(D().config?.notaCalda||'')+'" onchange="R(\'config/notaCalda\').set(this.value)"></label></div>'}
  if(sub==='equip'){html+='<div class="card"><div class="row" style="margin-bottom:8px"><span class="sp"></span><button class="pri" onclick="editEq()">Novo equipamento</button></div><table><thead><tr><th>Nome</th><th class="n">Tanque (L)</th><th class="n">Vazão (L/ha)</th><th class="n">ha por bomba</th><th>Regulagem</th><th></th></tr></thead><tbody>'+vals(D().equipamentos).map(e=>'<tr><td><b>'+h(e.nome)+'</b></td><td class="n">'+nf(e.cap,0)+'</td><td class="n">'+nf(e.vazao,0)+'</td><td class="n">'+nf(e.cap/e.vazao,1)+'</td><td>'+h(e.reg||'')+'</td><td class="row" style="gap:4px;flex-wrap:nowrap"><button class="sm" onclick="editEq(\''+e.id+'\')">Editar</button><button class="sm dg" onclick="delEq(\''+e.id+'\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}
  if(sub==='oper'){html+='<div class="card"><div class="row" style="margin-bottom:8px"><span class="mu sm-t">O operador entra pelo link '+h(location.origin+location.pathname)+'#op com o PIN dele.</span><span class="sp"></span><button class="pri" onclick="editOp()">Novo operador</button></div><table><thead><tr><th>Nome</th><th>PIN</th><th>WhatsApp</th><th>Situação</th><th></th></tr></thead><tbody>'+(vals(D().operadores).map(o=>'<tr><td><b>'+h(o.nome)+'</b></td><td class="mono">'+h(o.pin)+'</td><td>'+h(o.fone||'')+'</td><td>'+(o.ativo===false?'<span class="pill">inativo</span>':'<span class="pill p-ok">ativo</span>')+'</td><td class="row" style="gap:4px;flex-wrap:nowrap"><button class="sm" onclick="editOp(\''+o.id+'\')">Editar</button><button class="sm dg" onclick="delOp(\''+o.id+'\')">Excluir</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">Nenhum operador cadastrado.</td></tr>')+'</tbody></table></div>'}
  if(sub==='tal'){html+='<div class="grid g2"><div class="card"><table><thead><tr><th>Talhão</th><th class="n">ha (cadastro)</th><th class="n">ha no mapa</th><th></th></tr></thead><tbody>'+talhoes().map(t=>'<tr><td><b>'+t.n+'</b></td><td class="n">'+nf(t.ha)+'</td><td class="n mu">'+nf(areaMapa(t.n))+'</td><td><button class="sm" onclick="editTal('+t.n+')">Editar</button></td></tr>').join('')+'</tbody></table><p class="mu sm-t" style="margin:8px 0 0">As doses e bombas usam os hectares do cadastro (ou os da safra, se forem diferentes). A área do mapa é só referência.</p></div><div class="card">'+mapa([])+'</div></div>'}
  if(sub==='safra'){html+='<div class="card" style="max-width:640px"><div class="row" style="margin-bottom:8px"><span class="sp"></span><button class="pri" onclick="novaSafra()">Nova safra</button></div><table><tbody>'+safras().map(s=>'<tr><td><b>'+h(s.nome)+'</b></td><td>'+(s.id===S.safra?'<span class="pill p-ac">em uso</span>':'')+'</td><td class="row" style="gap:4px;flex-wrap:nowrap"><button class="sm" onclick="usarSafra(\''+s.id+'\')">Usar esta safra</button><button class="sm" onclick="renSafra(\''+s.id+'\')">Renomear</button><button class="sm dg" onclick="delSafra(\''+s.id+'\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>'}
  if(sub==='cfg'){html+='<div class="card" style="max-width:420px;display:grid;gap:10px"><label class="f">Novo PIN de administrador<input id="np" inputmode="numeric" type="password" maxlength="8"></label><div class="err" id="ne"></div><button class="pri" onclick="if(np.value.trim().length<4){ne.textContent=\'Use pelo menos 4 dígitos.\';return}R(\'config/pinAdmin\').set(np.value.trim());toast(\'PIN alterado\');np.value=\'\'">Alterar PIN</button><hr style="border:0;border-top:1px solid var(--ln);width:100%"><span class="mu sm-t">Link do operador: '+h(location.origin+location.pathname)+'#op</span></div>'}
  m.innerHTML=html;
}
function areaMapa(n){const c=Math.cos(-22.2*Math.PI/180),Rr=6371008.8;return (GEO.t[n]||[]).reduce((s,pl)=>{let a=0;const q=pl.map(([x,y])=>[x*Math.PI/180*Rr*c,-y*Math.PI/180*Rr]);for(let i=0;i<q.length;i++){const[x1,y1]=q[i],[x2,y2]=q[(i+1)%q.length];a+=x1*y2-x2*y1}return s+Math.abs(a)/2/1e4},0)}
function fp(v){S.pq=v;v=v.toLowerCase();document.querySelectorAll('tr[data-q]').forEach(r=>r.hidden=!!v&&!r.dataset.q.includes(v))}
function mvO(i,d){const o=[...ordem()],j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];R('config/ordem').set(o)}
function editProd(id){const p=id?prods()[id]:{nome:'',classe:'Herbicida',ativo:'',form:'?',unid:'L',carS:null,carM:null,st:'warn',obs:''};S.f={id};
 openM('<div class="mdh"><h3>'+(id?h(p.nome):'Novo produto')+'</h3><button onclick="closeM()">Fechar</button></div><div class="grid g4"><label class="f">Nome comercial<input id="pn" value="'+h(p.nome)+'"></label><label class="f">Classe<select id="pc">'+CLASSES.map(c=>'<option'+(c===p.classe?' selected':'')+'>'+c+'</option>').join('')+'</select></label><label class="f">Formulação<select id="pf">'+FORMS.map(f=>'<option value="'+f+'"'+(f===p.form?' selected':'')+'>'+(f==='?'?'definir':f)+'</option>').join('')+'</select></label><label class="f">Unidade<select id="pu"><option'+(p.unid==='L'?' selected':'')+'>L</option><option'+(p.unid==='kg'?' selected':'')+'>kg</option></select></label></div><label class="f">Ingrediente ativo<input id="pa" value="'+h(p.ativo||'')+'"></label><div class="grid g4"><label class="f">Carência soja (dias)<input id="cs" inputmode="numeric" value="'+h(p.carS??'')+'"></label><label class="f">Carência milho (dias)<input id="cm" inputmode="numeric" value="'+h(p.carM??'')+'"></label><label class="f">Situação<select id="ps"><option value="ok"'+(p.st==='ok'?' selected':'')+'>bula conferida</option><option value="known"'+(p.st==='known'?' selected':'')+'>registro conhecido</option><option value="warn"'+(p.st==='warn'?' selected':'')+'>conferir</option></select></label></div><label class="f">Observação para o operador (sai na cola)<input id="po" value="'+h(p.obs||'')+'"></label><div class="err" id="pe"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveProd()">Salvar</button></div>')}
function saveProd(){const nome=pn.value.trim();if(!nome){pe.textContent='Informe o nome.';return}const id=S.f.id||nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');if(!S.f.id&&prods()[id]){pe.textContent='Já existe um produto com esse nome.';return}
 R('produtos/'+id).set({nome,classe:pc.value,form:pf.value,unid:pu.value,ativo:pa.value.trim(),carS:num(cs.value),carM:num(cm.value),st:ps.value,obs:po.value.trim()});closeM();toast('Produto salvo')}
function editEq(id){const e=id?D().equipamentos[id]:{nome:'',cap:'',vazao:200,reg:''};S.f={id};openM('<div class="mdh"><h3>'+(id?h(e.nome):'Novo equipamento')+'</h3><button onclick="closeM()">Fechar</button></div><div class="grid g4"><label class="f">Nome<input id="en" value="'+h(e.nome)+'"></label><label class="f">Tanque (L)<input id="ec" inputmode="decimal" value="'+h(e.cap)+'"></label><label class="f">Vazão padrão (L/ha)<input id="ev" inputmode="decimal" value="'+h(e.vazao)+'"></label></div><label class="f">Regulagem (sai na cola)<input id="er" value="'+h(e.reg||'')+'" placeholder="BM 100 · RPM 1.600 · mínimo 5 km/h"></label><div class="err" id="ee"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveEq()">Salvar</button></div>')}
function saveEq(){const c=num(ec.value),v=num(ev.value);if(!en.value.trim()||!c||!v){ee.textContent='Preencha nome, tanque e vazão.';return}R('equipamentos/'+(S.f.id||uid())).set({nome:en.value.trim(),cap:c,vazao:v,reg:er.value.trim()});closeM()}
function editOp(id){const o=id?D().operadores[id]:{nome:'',pin:'',fone:'',ativo:true};S.f={id};openM('<div class="mdh"><h3>'+(id?h(o.nome):'Novo operador')+'</h3><button onclick="closeM()">Fechar</button></div><div class="grid g4"><label class="f">Nome<input id="on" value="'+h(o.nome)+'"></label><label class="f">PIN<input id="op" inputmode="numeric" maxlength="8" value="'+h(o.pin)+'"></label><label class="f">WhatsApp com DDD<input id="of" inputmode="tel" value="'+h(o.fone||'')+'" placeholder="14 99999-9999"></label><label class="f">Situação<select id="oa"><option value="1">ativo</option><option value="0"'+(o.ativo===false?' selected':'')+'>inativo</option></select></label></div><div class="err" id="oe2"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveOp()">Salvar</button></div>')}
function saveOp(){const p=op.value.trim();if(!on.value.trim()||p.length<4){oe2.textContent='Informe o nome e um PIN de pelo menos 4 dígitos.';return}if(p===D().config?.pinAdmin||vals(D().operadores).some(o=>o.id!==S.f.id&&String(o.pin)===p)){oe2.textContent='Esse PIN já está em uso.';return}let f=of.value.replace(/\D/g,'');if(f&&!f.startsWith('55'))f='55'+f;R('operadores/'+(S.f.id||uid())).set({nome:on.value.trim(),pin:p,fone:f,ativo:oa.value==='1'});closeM()}
function editTal(n){const t=D().talhoes[n];S.f={n};openM('<div class="mdh"><h3>Talhão '+n+'</h3><button onclick="closeM()">Fechar</button></div><label class="f" style="max-width:200px">Hectares<input id="th" inputmode="decimal" value="'+h(t.ha)+'"></label><div class="row"><span class="sp"></span><button class="pri" onclick="R(\'talhoes/\'+S.f.n+\'/ha\').set(num(th.value));closeM()">Salvar</button></div>')}
function novaSafra(){openM('<div class="mdh"><h3>Nova safra</h3><button onclick="closeM()">Fechar</button></div><label class="f">Nome<input id="sn" placeholder="Safra 2027"></label><label class="chk"><input type="checkbox" id="sc" checked> Copiar cultura, variedade, hectares e adubação da safra atual (sem datas)</label><label class="chk"><input type="checkbox" id="sa" checked> Copiar o programa de aplicações da safra atual como planejado (sem datas)</label><div class="err" id="se"></div><div class="row"><span class="sp"></span><button class="pri" onclick="saveSafra()">Criar</button></div>')}
function saveSafra(){const nome=sn.value.trim();if(!nome){se.textContent='Informe o nome.';return}const id=uid();const u={};const tal={};if(sc.checked&&safra())Object.entries(safra().talhoes||{}).filter(([k,v])=>v).forEach(([k,v])=>tal[k]={...v,plantio:'',cobData:''});u['safras/'+id]={nome,ativa:true,talhoes:tal};safras().forEach(s=>u['safras/'+s.id+'/ativa']=false);
 if(sa.checked)apls().forEach(a=>{u['aplicacoes/'+uid()]={safra:id,talhao:a.talhao,entrada:ent(a),estagio:a.estagio||'',dataPrev:'',prods:a.prods,status:'planejada',dataReal:''}});R().update(u);S.safra=id;closeM();toast(nome+' criada')}
function usoProd(id){let n=0;vals(D().aplicacoes).forEach(a=>{if((a.prods||[]).some(p=>p&&p.p===id))n++});return n}
function delProd(id){const p=prods()[id];const n=usoProd(id);const ab=vals(D().aplicacoes).filter(a=>a.status!=='realizada'&&(a.prods||[]).some(x=>x&&x.p===id));
 if(ab.length){openM('<div class="mdh"><h3>Não dá para excluir '+h(p.nome)+'</h3><button onclick="closeM()">Fechar</button></div><p style="margin:0">Ele está em '+ab.length+' aplicação(ões) ainda não realizada(s): '+ab.slice(0,8).map(a=>h(lbl(a))+' T'+a.talhao).join(', ')+(ab.length>8?'…':'')+'. Troque o produto nessas receitas no Planejamento e depois exclua.</p>');return}
 ask(n?'Excluir '+h(p.nome)+'? Ele some do cadastro e das listas, mas continua aparecendo no histórico das '+n+' aplicações já realizadas.':'Excluir '+h(p.nome)+' do cadastro?','Excluir',()=>n?R('produtos/'+id+'/excluido').set(true):R('produtos/'+id).remove())}
function delEq(id){const e=D().equipamentos[id];if(vals(D().os).some(o=>o.equip===id&&o.status==='aberta')){openM('<div class="mdh"><h3>Não dá para excluir</h3><button onclick="closeM()">Fechar</button></div><p style="margin:0">'+h(e.nome)+' está numa ordem de serviço aberta. Encerre ou cancele a OS antes.</p>');return}ask('Excluir '+h(e.nome)+'? As ordens antigas continuam com os dados da bomba.','Excluir',()=>R('equipamentos/'+id).remove())}
function delOp(id){const o=D().operadores[id];if(vals(D().os).some(x=>x.oper===id&&x.status==='aberta')){openM('<div class="mdh"><h3>Não dá para excluir</h3><button onclick="closeM()">Fechar</button></div><p style="margin:0">'+h(o.nome)+' tem ordem de serviço aberta. Troque o operador ou encerre a OS antes. Se ele só saiu da fazenda, você também pode marcá-lo como inativo.</p>');return}ask('Excluir '+h(o.nome)+'? O PIN dele deixa de funcionar. O nome continua nas ordens que ele já encerrou.','Excluir',()=>R('operadores/'+id).remove())}
function renSafra(id){const s=D().safras[id];S.f={id};openM('<div class="mdh"><h3>Renomear safra</h3><button onclick="closeM()">Fechar</button></div><label class="f">Nome<input id="rn" value="'+h(s.nome)+'"></label><div class="row"><span class="sp"></span><button class="pri" onclick="if(rn.value.trim())R(\'safras/\'+S.f.id+\'/nome\').set(rn.value.trim());closeM()">Salvar</button></div>')}
function delSafra(id){const s=D().safras[id];const A=vals(D().aplicacoes).filter(a=>a.safra===id),O=vals(D().os).filter(o=>o.safra===id),C=vals(D().colheita).filter(c=>c.safra===id);
 S.f={id};openM('<div class="mdh"><h3>Excluir '+h(s.nome)+'</h3><button onclick="closeM()">Fechar</button></div><p style="margin:0">Isso apaga de vez a safra com '+A.length+' aplicações, '+O.length+' ordens de serviço e '+C.length+' cargas de colheita. Não tem como desfazer.</p><label class="f">Para confirmar, digite o nome da safra<input id="cfn" placeholder="'+h(s.nome)+'"></label><div class="err" id="cfe"></div><div class="row"><span class="sp"></span><button onclick="closeM()">Cancelar</button><button class="pri" style="background:var(--er);border-color:var(--er)" onclick="doDelSafra()">Excluir safra</button></div>')}
function doDelSafra(){const id=S.f.id,s=D().safras[id];if(cfn.value.trim()!==s.nome){cfe.textContent='O nome não confere.';return}const u={['safras/'+id]:null};vals(D().aplicacoes).filter(a=>a.safra===id).forEach(a=>u['aplicacoes/'+a.id]=null);vals(D().os).filter(o=>o.safra===id).forEach(o=>u['os/'+o.id]=null);vals(D().colheita).filter(c=>c.safra===id).forEach(c=>u['colheita/'+c.id]=null);R().update(u);if(S.safra===id)S.safra=null;closeM();toast(s.nome+' excluída')}
function usarSafra(id){const u={};safras().forEach(s=>u['safras/'+s.id+'/ativa']=s.id===id);R().update(u);S.safra=id;toast('Safra alterada')}
</script>
